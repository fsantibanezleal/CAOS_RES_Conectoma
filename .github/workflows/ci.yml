name: CI

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

# ADR-0074: CI is a cheap check on committed files. The pytest suite, the renderings and the
# network runs happen locally, on the machine that has the data and the GPU, and their results
# are committed. Nothing here installs the offline lane, trains, renders or regenerates an
# artifact. A superseded run is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint
        run: pip install ruff==0.15.18 && ruff check .
      - name: CONTRACT 2, the manifests match the artifacts on disk (stdlib, no install)
        run: python scripts/check_artifacts.py

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build (typecheck, contract tests on the committed artifacts, bundle, a document per route)
        run: npm run build
      - name: Browser for the fit gate
        run: npx playwright install --with-deps chromium
      # the one expensive verification of the repo, run here and not again in the deploy (ADR-0074 rule 6)
      - name: Fit gate on the built site (ADR-0071, both themes, both languages, three sizes)
        run: npm run gate
      - name: Keep the gate's screenshots when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fit-gate-shots
          path: frontend/e2e-shots

  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Base-integrity guards (the regressions this archetype forbids)
        run: |
          fail=0
          if git ls-files | grep -qE '(^|/)\.env(\..+)?$' && ! git ls-files | grep -qx '.env.example'; then
            echo "::error::a real .env is tracked (only .env.example may be)"; fail=1; fi
          if git ls-files | grep -qiE '(^|/)\.?venv|\.(dll|so|dylib|pt|pth)$'; then
            echo "::error::a venv or native/heavy binary is tracked (recreate from requirements; keep models small/LFS)"; fail=1; fi
          if git ls-files | grep -qiE '\.(parquet|h5|hdf5|nc|mat|npy|feather)$'; then
            echo "::error::raw/heavy data tracked, commit only compact derived artifacts (data/derived/)"; fail=1; fi
          if git grep -nF 'D:\_Repos' -- . ':!.github' >/dev/null 2>&1; then
            echo "::error::leaked local machine path in a tracked file"; fail=1; fi
          if [ "$fail" -eq 0 ]; then echo "guards: OK"; fi
          exit $fail
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: No template residue (the example pipeline must not survive instantiation)
        run: python scripts/check_template_residue.py
      - name: No em-dash or emoji in product content (content standards)
        run: python scripts/check_content_standards.py
      - name: CI budget, no training, trunk-only triggers (ADR-0074)
        run: python scripts/check_ci_budget.py
