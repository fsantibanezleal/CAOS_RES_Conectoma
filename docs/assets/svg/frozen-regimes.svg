<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 486" width="900" class="rg-svg" role="img" aria-label="What each of the three frozen regimes may change">
  <!-- Hand-designed. Every colour is a shell variable with a fallback that follows the reader's colour
       scheme, so the diagram reads correctly both inlined in the app (ADR-0058) and as an image. -->
  <style>
    .rg-svg { --rg-bg:#ffffff; --rg-fg:#1f2328; --rg-sub:#57606a; --rg-grid:#d8dee4; --rg-acc:#0969da;
              --rg-accbg:#ddf4ff; --rg-panel:#f6f8fa; --rg-frz:#eaeef2; --rg-good:#1a7f37; }
    @media (prefers-color-scheme: dark) {
      .rg-svg { --rg-bg:#0d1117; --rg-fg:#e6edf3; --rg-sub:#8b949e; --rg-grid:#30363d; --rg-acc:#58a6ff;
                --rg-accbg:#0c2d6b; --rg-panel:#161b22; --rg-frz:#21262d; --rg-good:#3fb950; }
    }
    .rg-svg text { font-family: var(--font-sans, Inter, "Segoe UI", system-ui, sans-serif); }
    .rg-svg .bg { fill: var(--color-surface, var(--rg-bg)); }
    .rg-svg .panel { fill: var(--color-surface-2, var(--rg-panel)); stroke: var(--color-border, var(--rg-grid)); }
    .rg-svg .ttl { fill: var(--color-fg, var(--rg-fg)); font-size: 15px; font-weight: 700; }
    .rg-svg .eq { fill: var(--color-fg, var(--rg-fg)); font-size: 13px; font-family: var(--font-mono, ui-monospace, Consolas, monospace); }
    .rg-svg .h { fill: var(--color-fg, var(--rg-fg)); font-size: 13px; font-weight: 700; }
    .rg-svg .hs { fill: var(--color-fg-subtle, var(--rg-sub)); font-size: 10.5px; }
    .rg-svg .q { fill: var(--color-fg, var(--rg-fg)); font-size: 12px; font-weight: 700; }
    .rg-svg .qs { fill: var(--color-fg-subtle, var(--rg-sub)); font-size: 10px; }
    .rg-svg .frz { fill: var(--rg-frz); stroke: var(--color-border, var(--rg-grid)); }
    .rg-svg .trn { fill: var(--rg-accbg); stroke: var(--color-accent, var(--rg-acc)); }
    .rg-svg .ro { fill: none; stroke: var(--color-good, var(--rg-good)); stroke-dasharray: 3 2; }
    .rg-svg .tf { fill: var(--color-fg-subtle, var(--rg-sub)); font-size: 11px; }
    .rg-svg .tt { fill: var(--color-accent, var(--rg-acc)); font-size: 11px; font-weight: 700; }
    .rg-svg .tr { fill: var(--color-good, var(--rg-good)); font-size: 11px; font-weight: 700; }
    .rg-svg .n { fill: var(--color-fg, var(--rg-fg)); font-size: 14px; font-weight: 700; }
    .rg-svg .line { stroke: var(--color-border, var(--rg-grid)); }
  </style>
<rect class="bg" x="0" y="0" width="900" height="486" rx="12"/>
<text class="ttl" x="22" y="32">What "frozen weights" means here: one network, three regimes</text>
<text class="eq" x="22" y="58">τᵢ dVᵢ/dt = −Vᵢ + Σⱼ α σ N · ReLU(Vⱼ) + Vᵣₑₛₜ + eᵢ</text>
<text class="hs" x="22" y="76">the wiring, the counts and the signs are the measured connectome in every regime; the regimes differ only in what else a task may adjust</text>
<rect class="panel" x="22" y="92" width="856" height="374" rx="10"/>
<text class="h" x="415.0" y="118" text-anchor="middle">R0</text>
<text class="hs" x="415.0" y="134" text-anchor="middle">reservoir</text>
<text class="h" x="601.0" y="118" text-anchor="middle">R1</text>
<text class="hs" x="601.0" y="134" text-anchor="middle">biophysical</text>
<text class="h" x="787.0" y="118" text-anchor="middle">R2</text>
<text class="hs" x="787.0" y="134" text-anchor="middle">edge gain</text>
<line class="line" x1="34" y1="144" x2="866" y2="144"/>
<text class="q" x="36" y="162">Wiring</text>
<text class="qs" x="36" y="176">which types connect, at which column offsets</text>
<rect class="frz" x="336" y="150" width="158" height="26" rx="6"/>
<text class="tf" x="415.0" y="167" text-anchor="middle">frozen</text>
<rect class="frz" x="522" y="150" width="158" height="26" rx="6"/>
<text class="tf" x="601.0" y="167" text-anchor="middle">frozen</text>
<rect class="frz" x="708" y="150" width="158" height="26" rx="6"/>
<text class="tf" x="787.0" y="167" text-anchor="middle">frozen</text>
<line class="line" x1="34" y1="182" x2="866" y2="182"/>
<text class="q" x="36" y="200">Synapse counts N</text>
<text class="qs" x="36" y="214">per connection, from the release</text>
<rect class="frz" x="336" y="188" width="158" height="26" rx="6"/>
<text class="tf" x="415.0" y="205" text-anchor="middle">frozen</text>
<rect class="frz" x="522" y="188" width="158" height="26" rx="6"/>
<text class="tf" x="601.0" y="205" text-anchor="middle">frozen</text>
<rect class="frz" x="708" y="188" width="158" height="26" rx="6"/>
<text class="tf" x="787.0" y="205" text-anchor="middle">frozen</text>
<line class="line" x1="34" y1="220" x2="866" y2="220"/>
<text class="q" x="36" y="238">Signs σ</text>
<text class="qs" x="36" y="252">from the neurotransmitter predictions</text>
<rect class="frz" x="336" y="226" width="158" height="26" rx="6"/>
<text class="tf" x="415.0" y="243" text-anchor="middle">frozen</text>
<rect class="frz" x="522" y="226" width="158" height="26" rx="6"/>
<text class="tf" x="601.0" y="243" text-anchor="middle">frozen</text>
<rect class="frz" x="708" y="226" width="158" height="26" rx="6"/>
<text class="tf" x="787.0" y="243" text-anchor="middle">frozen</text>
<line class="line" x1="34" y1="258" x2="866" y2="258"/>
<text class="q" x="36" y="276">Synaptic strength α</text>
<text class="qs" x="36" y="290">scale on the synapse count, non-negative</text>
<rect class="frz" x="336" y="264" width="158" height="26" rx="6"/>
<text class="tf" x="415.0" y="281" text-anchor="middle">frozen</text>
<rect class="trn" x="522" y="264" width="158" height="26" rx="6"/>
<text class="tt" x="601.0" y="281" text-anchor="middle">trained, per type pair</text>
<rect class="trn" x="708" y="264" width="158" height="26" rx="6"/>
<text class="tt" x="787.0" y="281" text-anchor="middle">trained, per connection</text>
<line class="line" x1="34" y1="296" x2="866" y2="296"/>
<text class="q" x="36" y="314">Time constant τ</text>
<text class="qs" x="36" y="328">how fast a cell integrates</text>
<rect class="frz" x="336" y="302" width="158" height="26" rx="6"/>
<text class="tf" x="415.0" y="319" text-anchor="middle">frozen</text>
<rect class="trn" x="522" y="302" width="158" height="26" rx="6"/>
<text class="tt" x="601.0" y="319" text-anchor="middle">trained, per cell type</text>
<rect class="trn" x="708" y="302" width="158" height="26" rx="6"/>
<text class="tt" x="787.0" y="319" text-anchor="middle">trained, per neuron</text>
<line class="line" x1="34" y1="334" x2="866" y2="334"/>
<text class="q" x="36" y="352">Resting potential Vᵣₑₛₜ</text>
<text class="qs" x="36" y="366">the cell's voltage at rest</text>
<rect class="frz" x="336" y="340" width="158" height="26" rx="6"/>
<text class="tf" x="415.0" y="357" text-anchor="middle">frozen</text>
<rect class="trn" x="522" y="340" width="158" height="26" rx="6"/>
<text class="tt" x="601.0" y="357" text-anchor="middle">trained, per cell type</text>
<rect class="trn" x="708" y="340" width="158" height="26" rx="6"/>
<text class="tt" x="787.0" y="357" text-anchor="middle">trained, per neuron</text>
<line class="line" x1="34" y1="372" x2="866" y2="372"/>
<text class="q" x="36" y="390">Readout</text>
<text class="qs" x="36" y="404">outside the network: depth, masks</text>
<rect class="ro" x="336" y="378" width="158" height="26" rx="6"/>
<text class="tr" x="415.0" y="395" text-anchor="middle">trained</text>
<rect class="ro" x="522" y="378" width="158" height="26" rx="6"/>
<text class="tr" x="601.0" y="395" text-anchor="middle">trained</text>
<rect class="ro" x="708" y="378" width="158" height="26" rx="6"/>
<text class="tr" x="787.0" y="395" text-anchor="middle">trained</text>
<line class="line" x1="34" y1="410" x2="866" y2="410"/>
<text class="q" x="36" y="430">Trainable inside the network</text>
<text class="qs" x="36" y="444">right optic lobe, 253 types, 40,051 cells, 2,922,900 connections</text>
<text class="n" x="415.0" y="436" text-anchor="middle">0</text>
<text class="n" x="601.0" y="436" text-anchor="middle">8,409</text>
<text class="n" x="787.0" y="436" text-anchor="middle">3,003,002</text>
<text class="qs" x="601.0" y="452" text-anchor="middle">the published model: 734</text>
</svg>
