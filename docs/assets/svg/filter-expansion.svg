<text class="ok" x="474" y="380">Every Dm cell receives its full measured input;</text>
<text class="ok" x="474" y="395">entries that meet at one Mi cell are summed.</text>
<rect class="panel" x="22" y="424" width="856" height="100" rx="10"/>
<text class="h" x="36" y="446">A population node</text>
<text class="sub" x="36" y="464">A type with fewer than one cell per 20 columns is one node standing for the mean activity of its cells.</text>
<text class="sub" x="36" y="480">It receives through its filter like a cell at the centre, and it drives every cell of each target type</text>
<text class="sub" x="36" y="496">with the measured average synapses per target cell over the whole pair, because each cell is reached by some member.</text>
<circle class="pop" cx="640" cy="482" r="9"/>
<text class="al" x="640" y="508" text-anchor="middle">population</text>
