<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" class="fx-svg" role="img" aria-label="How a measured filter reaches its target cells when cell types sit on sublattices">
  <!-- Hand-designed; generated from exact lattice coordinates. Every colour is a shell variable with a
       fallback that follows the reader's colour scheme, so the diagram reads correctly both inlined in
       the app (ADR-0058) and as an image in the repository. -->
  <style>
    .fx-svg { --fx-bg:#ffffff; --fx-fg:#1f2328; --fx-sub:#57606a; --fx-grid:#d8dee4; --fx-acc:#0969da;
              --fx-mag:#bf3989; --fx-good:#1a7f37; --fx-bad:#cf222e; --fx-panel:#f6f8fa; }
    @media (prefers-color-scheme: dark) {
      .fx-svg { --fx-bg:#0d1117; --fx-fg:#e6edf3; --fx-sub:#8b949e; --fx-grid:#30363d; --fx-acc:#58a6ff;
                --fx-mag:#db61a2; --fx-good:#3fb950; --fx-bad:#f85149; --fx-panel:#161b22; }
    }
    .fx-svg text { font-family: var(--font-sans, Inter, "Segoe UI", system-ui, sans-serif); }
    .fx-svg .bg { fill: var(--color-surface, var(--fx-bg)); }
    .fx-svg .panel { fill: var(--color-surface-2, var(--fx-panel)); stroke: var(--color-border, var(--fx-grid)); stroke-width: 1; }
    .fx-svg .ttl { fill: var(--color-fg, var(--fx-fg)); font-size: 15px; font-weight: 700; }
    .fx-svg .h { fill: var(--color-fg, var(--fx-fg)); font-size: 12.5px; font-weight: 700; }
    .fx-svg .sub { fill: var(--color-fg-subtle, var(--fx-sub)); font-size: 10.5px; }
    .fx-svg .hx { fill: none; stroke: var(--color-border, var(--fx-grid)); stroke-width: 0.9; }
    .fx-svg .mi { fill: var(--color-accent, var(--fx-acc)); }
    .fx-svg .dm { fill: none; stroke: var(--color-magenta, var(--fx-mag)); stroke-width: 2; }
    .fx-svg .pop { fill: var(--color-magenta, var(--fx-mag)); }
    .fx-svg .kept { fill: none; stroke: var(--color-good, var(--fx-good)); stroke-width: 1.6; }
    .fx-svg .lost { fill: none; stroke: var(--color-bad, var(--fx-bad)); stroke-width: 1.4; stroke-dasharray: 4 3; }
    .fx-svg .al { fill: var(--color-fg, var(--fx-fg)); font-size: 10px; font-weight: 700; }
    .fx-svg .ok { fill: var(--color-good, var(--fx-good)); font-size: 10.5px; font-weight: 700; }
    .fx-svg .no { fill: var(--color-bad, var(--fx-bad)); font-size: 10.5px; font-weight: 700; }
    .fx-svg .mono { font-family: var(--font-mono, ui-monospace, Consolas, monospace); fill: var(--color-fg, var(--fx-fg)); font-size: 10.5px; }
  </style>
  <defs>
    <marker id="fx-arrow-kept" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--color-good, var(--fx-good))"/>
    </marker>
    <marker id="fx-arrow-lost" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--color-bad, var(--fx-bad))"/>
    </marker>
  </defs>
<rect class="bg" x="0" y="0" width="900" height="540" rx="12"/>
<text class="ttl" x="22" y="32">How a measured filter reaches its target cells on sublattices</text>
<text class="sub" x="22" y="50">Mi sits on every second column (2x2 sublattice), Dm on every third (3x3). The measured filter from Mi onto a Dm cell has two entries, 3 synapses at offset (0,0) and 2 at (1,-1): 5 in total.</text>
<circle class="mi" cx="28" cy="72" r="5.2"/><text class="sub" x="38" y="76">Mi cell (source)</text>
<rect class="dm" x="146" y="65.5" width="13" height="13" rx="2" transform="rotate(45 152.5 72)"/><text class="sub" x="166" y="76">Dm cell (target)</text>
<path class="kept" d="M284,72 L314,72" marker-end="url(#fx-arrow-kept)"/><text class="sub" x="322" y="76">filter entry realised</text>
<path class="lost" d="M442,72 L472,72" marker-end="url(#fx-arrow-lost)"/><text class="sub" x="480" y="76">entry that lands on no cell</text>
<rect class="panel" x="22" y="92" width="418" height="316" rx="10"/>
<text class="h" x="36" y="114">Expanded from the sources (the engine's rule)</text>
<text class="sub" x="36" y="130">each Mi cell sends each entry to the column at its offset, if a Dm cell is there</text>
