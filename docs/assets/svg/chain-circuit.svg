<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" class="cc-svg" role="img" aria-label="The measured circuit of the fly's visual pathway, from the eye to the network's answer">
  <!-- Drawn from data/derived/chain/circuit.json: every connection below is one the committed
       connectome specification has, as wide as its synapse count onto one target cell, warm if
       excitatory and cool if inhibitory. Colours follow the reader's scheme, inlined or as an image. -->
  <style>
    .cc-svg { --cc-bg:#ffffff; --cc-fg:#1f2328; --cc-sub:#57606a; --cc-grid:#d8dee4; --cc-acc:#0969da;
              --cc-panel:#f6f8fa; --cc-ex:#b2182b; --cc-in:#2166ac; --cc-good:#1a7f37; }
    @media (prefers-color-scheme: dark) {
      .cc-svg { --cc-bg:#0d1117; --cc-fg:#e6edf3; --cc-sub:#8b949e; --cc-grid:#30363d; --cc-acc:#58a6ff;
                --cc-panel:#161b22; --cc-ex:#f4a582; --cc-in:#92c5de; --cc-good:#3fb950; }
    }
    .cc-svg text { font-family: var(--font-sans, Inter, "Segoe UI", system-ui, sans-serif); }
    .cc-svg .bg { fill: var(--color-surface, var(--cc-bg)); }
    .cc-svg .panel { fill: var(--color-surface-2, var(--cc-panel)); stroke: var(--color-border, var(--cc-grid)); }
    .cc-svg .ttl { fill: var(--color-fg, var(--cc-fg)); font-size: 15px; font-weight: 700; }
    .cc-svg .hs { fill: var(--color-fg-subtle, var(--cc-sub)); font-size: 10.5px; }
    .cc-svg .h { fill: var(--color-fg, var(--cc-fg)); font-size: 12px; font-weight: 700; }
    .cc-svg .lb { fill: var(--color-fg, var(--cc-fg)); font-size: 10.5px; font-weight: 600; paint-order: stroke; stroke: var(--color-surface-2, var(--cc-panel)); stroke-width: 3.5px; stroke-linejoin: round; }
    .cc-svg .ex { fill: none; stroke: var(--cc-ex); stroke-opacity: 0.55; }
    .cc-svg .in { fill: none; stroke: var(--cc-in); stroke-opacity: 0.6; }
    .cc-svg .nd { fill: var(--color-surface, var(--cc-bg)); stroke: var(--color-fg-subtle, var(--cc-sub)); stroke-width: 1.2; }
    .cc-svg .wide { stroke-dasharray: 2 2; }
    .cc-svg .hd { fill: none; stroke: var(--color-fg-subtle, var(--cc-sub)); stroke-dasharray: 4 4; stroke-width: 1; }
    .cc-svg .head { fill: var(--color-surface, var(--cc-bg)); stroke: var(--color-fg-subtle, var(--cc-sub)); stroke-dasharray: 4 4; }
    .cc-svg .out { fill: var(--color-surface, var(--cc-bg)); stroke: var(--color-good, var(--cc-good)); stroke-width: 1.5; }
    .cc-svg .key { stroke-width: 3; }
    svg .l-es { display: none; }
  </style>
