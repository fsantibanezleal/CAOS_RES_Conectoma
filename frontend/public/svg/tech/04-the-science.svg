  <text class="hd l-en" x="300" y="330">On the lattice a cell type is a filter</text>
  <text class="hd l-es" x="300" y="330">En la retícula un tipo celular es un filtro</text>
  <text class="sub l-en" x="300" y="350">the synapses a target cell receives from each column offset, averaged</text>
  <text class="sub l-es" x="300" y="350">las sinapsis que una célula destino recibe desde cada desplazamiento de columna, promediadas</text>
  <text class="sub l-en" x="300" y="366">over the type and repeated on every column of the eye</text>
  <text class="sub l-es" x="300" y="366">sobre el tipo y repetidas en cada columna del ojo</text>
  <text class="hd l-en" x="300" y="390">In the whole visual system every cell is its own</text>
  <text class="hd l-es" x="300" y="390">En el sistema visual completo cada célula es propia</text>
  <text class="sub l-en" x="300" y="410">105,011 neurons, 12,450,379 connections, no averaging</text>
  <text class="sub l-es" x="300" y="410">105.011 neuronas, 12.450.379 conexiones, sin promediar</text>
</svg>
