<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" class="arch-svg" role="img" aria-label="Conectoma: from wiring to a network">
  <style>
    .arch-svg text { font-family: var(--font-sans, Inter, "Segoe UI", system-ui, sans-serif); }
    .arch-svg .mono { font-family: var(--font-mono, ui-monospace, Consolas, monospace); }
    .arch-svg .bx { fill: var(--color-surface-2); stroke: var(--color-border); stroke-width: 1.2; }
    .arch-svg .bx-hi { stroke: var(--color-accent); stroke-width: 1.6; }
    .arch-svg .bx-good { stroke: var(--color-good); }
    .arch-svg .bx-warn { stroke: var(--color-warn); }
    .arch-svg .bx-plan { stroke-dasharray: 5 4; }
    .arch-svg .lane { fill: none; stroke: var(--color-border); stroke-width: 1; stroke-dasharray: 2 3; }
    .arch-svg .ttl { fill: var(--color-fg); font-size: 13px; font-weight: 600; }
    .arch-svg .hd { fill: var(--color-fg); font-size: 11.5px; font-weight: 600; }
    .arch-svg .sub { fill: var(--color-fg-subtle); font-size: 10px; }
    .arch-svg .cd { fill: var(--color-accent); font-size: 9.5px; }
    .arch-svg .lbl { fill: var(--color-accent); font-size: 10px; font-weight: 600; }
    .arch-svg .lane-lbl { fill: var(--color-fg-faint); font-size: 10px; font-weight: 600; letter-spacing: 0.04em; }
    .arch-svg .good { fill: var(--color-good); }
    .arch-svg .warn { fill: var(--color-warn); }
    .arch-svg .flow { fill: none; stroke: var(--color-fg-faint); stroke-width: 1.5; marker-end: url(#arr); }
    .arch-svg .flow-hi { fill: none; stroke: var(--color-accent); stroke-width: 1.5; marker-end: url(#arr-hi); }
    .arch-svg .wire { fill: none; stroke: var(--color-fg-faint); stroke-width: 1.2; }
    .arch-svg .cell { fill: var(--color-surface); stroke: var(--color-fg-subtle); stroke-width: 1.2; }
    .arch-svg .cell-hi { fill: var(--color-accent-soft); stroke: var(--color-accent); stroke-width: 1.4; }
    .arch-svg .hex { fill: none; stroke: var(--color-border); stroke-width: 1; }
    .arch-svg .hex-src { fill: var(--color-accent-soft); stroke: var(--color-accent); stroke-width: 1.2; }
    .arch-svg .hex-tar { fill: var(--color-surface); stroke: var(--color-fg); stroke-width: 1.4; }
    svg .l-es { display: none; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--color-fg-faint)"/>
    </marker>
    <marker id="arr-hi" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent)"/>
    </marker>
  </defs>
  <text class="ttl l-en" x="20" y="28">From wiring to a network: what is measured and what may learn</text>
  <text class="ttl l-es" x="20" y="28">Del cableado a una red: qué se mide y qué puede aprender</text>
  <circle class="cell" cx="60" cy="80" r="18"/>
  <text class="sub" x="60" y="84" text-anchor="middle">Va</text>
  <rect class="bx" x="102" y="67" width="54" height="26" rx="5"/>
  <text class="cd mono" x="129" y="84" text-anchor="middle">ReLU</text>
  <path class="wire" d="M78 80 H 100"/>
  <path class="flow" d="M156 80 C 200 80, 220 140, 262 140"/>
  <circle class="cell" cx="60" cy="140" r="18"/>
  <text class="sub" x="60" y="144" text-anchor="middle">Vb</text>
  <rect class="bx" x="102" y="127" width="54" height="26" rx="5"/>
  <text class="cd mono" x="129" y="144" text-anchor="middle">ReLU</text>
  <path class="wire" d="M78 140 H 100"/>
  <path class="flow" d="M156 140 C 200 140, 220 140, 262 140"/>
  <circle class="cell" cx="60" cy="200" r="18"/>
  <text class="sub" x="60" y="204" text-anchor="middle">Vc</text>
  <rect class="bx" x="102" y="187" width="54" height="26" rx="5"/>
  <text class="cd mono" x="129" y="204" text-anchor="middle">ReLU</text>
  <path class="wire" d="M78 200 H 100"/>
  <path class="flow" d="M156 200 C 200 200, 220 140, 262 140"/>
  <circle class="cell-hi" cx="290" cy="140" r="26"/>
  <text class="hd" x="290" y="144" text-anchor="middle">V</text>
  <text class="lbl l-en" x="210" y="72">w = sign x count x strength</text>
  <text class="lbl l-es" x="210" y="72">w = signo x conteo x intensidad</text>
  <text class="sub l-en" x="290" y="186" text-anchor="middle">target cell</text>
  <text class="sub l-es" x="290" y="186" text-anchor="middle">célula destino</text>
  <text class="cd mono" x="20" y="250">tau dV/dt = -V + V_rest + sum_j w_j ReLU(V_j) + e</text>
  <text class="sub l-en" x="20" y="272">a passive point neuron: it relaxes to rest and is driven by its partners</text>
  <text class="sub l-es" x="20" y="272">una neurona puntual pasiva: relaja al reposo y la impulsan sus socios</text>
  <rect class="bx bx-good" x="360" y="50" width="250" height="110" rx="9"/>
  <text class="hd l-en" x="372" y="72">Measured, frozen</text>
  <text class="hd l-es" x="372" y="72">Medido, congelado</text>
  <text class="sub l-en" x="372" y="90">sign: from the transmitter prediction</text>
  <text class="sub l-es" x="372" y="90">signo: desde la predicción de transmisor</text>
  <text class="sub l-en" x="372" y="105">count: synapses in the reconstruction</text>
  <text class="sub l-es" x="372" y="105">conteo: sinapsis de la reconstrucción</text>
  <text class="sub l-en" x="372" y="120">wiring: who connects to whom</text>
  <text class="sub l-es" x="372" y="120">cableado: quién conecta con quién</text>
  <rect class="bx bx-warn" x="630" y="50" width="250" height="110" rx="9"/>
  <text class="hd l-en" x="642" y="72">What may learn</text>
  <text class="hd l-es" x="642" y="72">Lo que puede aprender</text>
  <text class="sub l-en" x="642" y="90">strength of each weight</text>
  <text class="sub l-es" x="642" y="90">intensidad de cada peso</text>
  <text class="sub l-en" x="642" y="105">time constant tau</text>
  <text class="sub l-es" x="642" y="105">constante de tiempo tau</text>
  <text class="sub l-en" x="642" y="120">resting potential V_rest</text>
  <text class="sub l-es" x="642" y="120">potencial de reposo V_rest</text>
  <rect class="bx" x="360" y="176" width="520" height="96" rx="9"/>
  <text class="hd l-en" x="372" y="198">Three regimes</text>
  <text class="hd l-es" x="372" y="198">Tres regímenes</text>
  <text class="sub l-en" x="372" y="216">R0: nothing learns; the connectome is a reservoir</text>
  <text class="sub l-es" x="372" y="216">R0: nada aprende; el conectoma es un reservorio</text>
  <text class="sub l-en" x="372" y="231">R1: shared per cell type and type pair (8,409 values on the lattice)</text>
  <text class="sub l-es" x="372" y="231">R1: compartido por tipo celular y par de tipos (8.409 valores en la retícula)</text>
  <text class="sub l-en" x="372" y="246">R2: per neuron and connection (3,003,002 values on the lattice)</text>
  <text class="sub l-es" x="372" y="246">R2: por neurona y conexión (3.003.002 valores en la retícula)</text>
