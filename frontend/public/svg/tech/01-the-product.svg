<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" class="arch-svg" role="img" aria-label="Conectoma: a measured wiring, frozen, asked to see">
  <style>
    .arch-svg text { font-family: var(--font-sans, Inter, "Segoe UI", system-ui, sans-serif); }
    .arch-svg .mono { font-family: var(--font-mono, ui-monospace, Consolas, monospace); }
    .arch-svg .bx { fill: var(--color-surface-2); stroke: var(--color-border); stroke-width: 1.2; }
    .arch-svg .bx-hi { stroke: var(--color-accent); stroke-width: 1.6; }
    .arch-svg .bx-good { stroke: var(--color-good); }
    .arch-svg .bx-warn { stroke: var(--color-warn); }
    .arch-svg .bx-plan { stroke-dasharray: 5 4; }
    .arch-svg .lane { fill: none; stroke: var(--color-border); stroke-width: 1; stroke-dasharray: 2 3; }
    .arch-svg .ttl { fill: var(--color-fg); font-size: 13px; font-weight: 600; }
    .arch-svg .hd { fill: var(--color-fg); font-size: 11.5px; font-weight: 600; }
    .arch-svg .sub { fill: var(--color-fg-subtle); font-size: 10px; }
    .arch-svg .cd { fill: var(--color-accent); font-size: 9.5px; }
    .arch-svg .lbl { fill: var(--color-accent); font-size: 10px; font-weight: 600; }
    .arch-svg .lane-lbl { fill: var(--color-fg-faint); font-size: 10px; font-weight: 600; letter-spacing: 0.04em; }
    .arch-svg .good { fill: var(--color-good); }
    .arch-svg .warn { fill: var(--color-warn); }
    .arch-svg .flow { fill: none; stroke: var(--color-fg-faint); stroke-width: 1.5; marker-end: url(#arr); }
    .arch-svg .flow-hi { fill: none; stroke: var(--color-accent); stroke-width: 1.5; marker-end: url(#arr-hi); }
    .arch-svg .wire { fill: none; stroke: var(--color-fg-faint); stroke-width: 1.2; }
    .arch-svg .cell { fill: var(--color-surface); stroke: var(--color-fg-subtle); stroke-width: 1.2; }
    .arch-svg .cell-hi { fill: var(--color-accent-soft); stroke: var(--color-accent); stroke-width: 1.4; }
    .arch-svg .hex { fill: none; stroke: var(--color-border); stroke-width: 1; }
    .arch-svg .hex-src { fill: var(--color-accent-soft); stroke: var(--color-accent); stroke-width: 1.2; }
    .arch-svg .hex-tar { fill: var(--color-surface); stroke: var(--color-fg); stroke-width: 1.4; }
    svg .l-es { display: none; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--color-fg-faint)"/>
    </marker>
    <marker id="arr-hi" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent)"/>
    </marker>
  </defs>
  <text class="ttl l-en" x="20" y="28">A measured wiring, frozen, asked to see</text>
  <text class="ttl l-es" x="20" y="28">Un cableado medido, congelado, puesto a ver</text>
  <rect class="bx" x="20" y="50" width="250" height="150" rx="9"/>
  <text class="hd l-en" x="32" y="72">MaleCNS v1.0 connectome</text>
  <text class="hd l-es" x="32" y="72">Conectoma MaleCNS v1.0</text>
  <text class="sub l-en" x="32" y="90">166,691 neurons, CC-BY</text>
  <text class="sub l-es" x="32" y="90">166.691 neuronas, CC-BY</text>
  <text class="sub l-en" x="32" y="105">wiring, synapse counts, signs</text>
  <text class="sub l-es" x="32" y="105">cableado, conteos de sinapsis, signos</text>
  <text class="sub l-en" x="32" y="120">measured, never trained</text>
  <text class="sub l-es" x="32" y="120">medidos, nunca entrenados</text>
  <text class="cd mono" x="32" y="188">male-cns:v1.0</text>
  <path class="flow-hi" d="M270 125 H 316"/>
  <rect class="bx bx-hi" x="320" y="50" width="260" height="150" rx="9"/>
  <text class="hd l-en" x="332" y="72">Frozen network</text>
  <text class="hd l-es" x="332" y="72">Red congelada</text>
  <text class="sub l-en" x="332" y="90">R0: nothing learns</text>
  <text class="sub l-es" x="332" y="90">R0: nada aprende</text>
  <text class="sub l-en" x="332" y="105">R1: per type or type pair</text>
  <text class="sub l-es" x="332" y="105">R1: por tipo o par de tipos</text>
  <text class="sub l-en" x="332" y="120">R2: per neuron or connection</text>
  <text class="sub l-es" x="332" y="120">R2: por neurona o conexión</text>
  <text class="cd mono" x="332" y="188">flyvis 1.2.0</text>
  <path class="flow" d="M580 125 H 626"/>
  <rect class="bx bx-plan" x="630" y="50" width="250" height="150" rx="9"/>
  <text class="hd l-en" x="642" y="72">Vision tasks</text>
  <text class="hd l-es" x="642" y="72">Tareas de visión</text>
  <text class="sub l-en" x="642" y="90">depth from a moving camera</text>
  <text class="sub l-es" x="642" y="90">profundidad desde cámara en movimiento</text>
  <text class="sub l-en" x="642" y="105">segmentation by relative motion</text>
  <text class="sub l-es" x="642" y="105">segmentación por movimiento relativo</text>
  <text class="sub l-en" x="642" y="120">single images: the non-native case</text>
  <text class="sub l-es" x="642" y="120">imagen única: el caso no nativo</text>
  <text class="cd mono" x="642" y="188">AbsRel, delta, mIoU, latency</text>
  <rect class="bx bx-good" x="20" y="240" width="250" height="120" rx="9"/>
  <text class="hd l-en" x="32" y="262">Built and measured</text>
  <text class="hd l-es" x="32" y="262">Construido y medido</text>
  <text class="sub l-en" x="32" y="280">right optic lobe on the lattice</text>
  <text class="sub l-es" x="32" y="280">lóbulo óptico derecho en la retícula</text>
  <text class="sub l-en" x="32" y="295">whole visual system, per neuron</text>
  <text class="sub l-es" x="32" y="295">sistema visual completo, por neurona</text>
  <text class="sub l-en" x="32" y="310">parity with the published model</text>
  <text class="sub l-es" x="32" y="310">paridad con el modelo publicado</text>
  <path class="flow" d="M145 240 C 145 222, 330 222, 350 204"/>
  <rect class="bx bx-warn" x="320" y="240" width="260" height="120" rx="9"/>
  <text class="hd l-en" x="332" y="262">Null controls</text>
  <text class="hd l-es" x="332" y="262">Controles nulos</text>
  <text class="sub l-en" x="332" y="280">N1: rewired, degrees kept</text>
  <text class="sub l-es" x="332" y="280">N1: recableado, grados conservados</text>
  <text class="sub l-en" x="332" y="295">N2: random, same size</text>
  <text class="sub l-es" x="332" y="295">N2: aleatorio, mismo tamaño</text>
  <text class="sub l-en" x="332" y="310">N3: signs shuffled</text>
  <text class="sub l-es" x="332" y="310">N3: signos permutados</text>
  <path class="flow" d="M450 240 V 204"/>
  <text class="lbl l-en" x="458" y="226">same size, no biology</text>
  <text class="lbl l-es" x="458" y="226">mismo tamaño, sin biología</text>
  <rect class="bx bx-plan" x="630" y="240" width="250" height="120" rx="9"/>
  <text class="hd l-en" x="642" y="262">Comparators</text>
  <text class="hd l-es" x="642" y="262">Comparadores</text>
  <text class="sub l-en" x="642" y="280">frozen learned backbone, same head</text>
  <text class="sub l-es" x="642" y="280">backbone aprendido congelado, mismo cabezal</text>
  <text class="sub l-en" x="642" y="295">matched recurrent CNN</text>
  <text class="sub l-es" x="642" y="295">CNN recurrente equiparada</text>
  <text class="sub l-en" x="642" y="310">foundation references</text>
  <text class="sub l-es" x="642" y="310">referencias fundacionales</text>
  <path class="flow" d="M755 240 V 204"/>
  <text class="hd l-en" x="20" y="396">The question: does the wiring help, and is any effect biology?</text>
  <text class="hd l-es" x="20" y="396">La pregunta: ¿ayuda el cableado, y es biología cualquier efecto?</text>
  <rect class="bx bx-plan" x="630" y="386" width="22" height="12" rx="3"/>
  <text class="sub l-en" x="660" y="396">dashed: planned, not built yet</text>
  <text class="sub l-es" x="660" y="396">punteado: planificado, aún no construido</text>
</svg>
