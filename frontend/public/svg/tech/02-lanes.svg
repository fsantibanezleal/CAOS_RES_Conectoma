<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" class="arch-svg" role="img" aria-label="Conectoma: heavy work offline, a verified artifact in the browser">
  <style>
    .arch-svg text { font-family: var(--font-sans, Inter, "Segoe UI", system-ui, sans-serif); }
    .arch-svg .mono { font-family: var(--font-mono, ui-monospace, Consolas, monospace); }
    .arch-svg .bx { fill: var(--color-surface-2); stroke: var(--color-border); stroke-width: 1.2; }
    .arch-svg .bx-hi { stroke: var(--color-accent); stroke-width: 1.6; }
    .arch-svg .bx-good { stroke: var(--color-good); }
    .arch-svg .bx-warn { stroke: var(--color-warn); }
    .arch-svg .bx-plan { stroke-dasharray: 5 4; }
    .arch-svg .lane { fill: none; stroke: var(--color-border); stroke-width: 1; stroke-dasharray: 2 3; }
    .arch-svg .ttl { fill: var(--color-fg); font-size: 13px; font-weight: 600; }
    .arch-svg .hd { fill: var(--color-fg); font-size: 11.5px; font-weight: 600; }
    .arch-svg .sub { fill: var(--color-fg-subtle); font-size: 10px; }
    .arch-svg .cd { fill: var(--color-accent); font-size: 9.5px; }
    .arch-svg .lbl { fill: var(--color-accent); font-size: 10px; font-weight: 600; }
    .arch-svg .lane-lbl { fill: var(--color-fg-faint); font-size: 10px; font-weight: 600; letter-spacing: 0.04em; }
    .arch-svg .good { fill: var(--color-good); }
    .arch-svg .warn { fill: var(--color-warn); }
    .arch-svg .flow { fill: none; stroke: var(--color-fg-faint); stroke-width: 1.5; marker-end: url(#arr); }
    .arch-svg .flow-hi { fill: none; stroke: var(--color-accent); stroke-width: 1.5; marker-end: url(#arr-hi); }
    .arch-svg .wire { fill: none; stroke: var(--color-fg-faint); stroke-width: 1.2; }
    .arch-svg .cell { fill: var(--color-surface); stroke: var(--color-fg-subtle); stroke-width: 1.2; }
    .arch-svg .cell-hi { fill: var(--color-accent-soft); stroke: var(--color-accent); stroke-width: 1.4; }
    .arch-svg .hex { fill: none; stroke: var(--color-border); stroke-width: 1; }
    .arch-svg .hex-src { fill: var(--color-accent-soft); stroke: var(--color-accent); stroke-width: 1.2; }
    .arch-svg .hex-tar { fill: var(--color-surface); stroke: var(--color-fg); stroke-width: 1.4; }
    svg .l-es { display: none; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--color-fg-faint)"/>
    </marker>
    <marker id="arr-hi" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent)"/>
    </marker>
  </defs>
  <text class="ttl l-en" x="20" y="28">Heavy work offline, a verified artifact in the browser</text>
  <text class="ttl l-es" x="20" y="28">Trabajo pesado offline, un artefacto verificado en el navegador</text>
  <rect class="lane" x="10" y="44" width="880" height="150" rx="10"/>
  <text class="lane-lbl l-en" x="22" y="62">OFFLINE PIPELINE  (Python 3.12, flyvis, GPU)</text>
  <text class="lane-lbl l-es" x="22" y="62">PIPELINE OFFLINE  (Python 3.12, flyvis, GPU)</text>
  <rect class="bx" x="22" y="74" width="200" height="108" rx="9"/>
  <text class="hd l-en" x="34" y="96">Release tables</text>
  <text class="hd l-es" x="34" y="96">Tablas de la liberación</text>
  <text class="sub l-en" x="34" y="114">151,856,684 connection rows</text>
  <text class="sub l-es" x="34" y="114">151.856.684 filas de conexión</text>
  <text class="sub l-en" x="34" y="129">annotations, transmitters</text>
  <text class="sub l-es" x="34" y="129">anotaciones, transmisores</text>
  <text class="cd mono" x="34" y="170">build-connectome</text>
  <path class="flow" d="M222 128 H 240"/>
  <rect class="bx" x="244" y="74" width="200" height="108" rx="9"/>
  <text class="hd l-en" x="256" y="96">Consensus connectome</text>
  <text class="hd l-es" x="256" y="96">Conectoma de consenso</text>
  <text class="sub l-en" x="256" y="114">253 types, 7,907 connections</text>
  <text class="sub l-es" x="256" y="114">253 tipos, 7.907 conexiones</text>
  <text class="sub l-en" x="256" y="129">columns inferred, holdout</text>
  <text class="sub l-es" x="256" y="129">columnas inferidas, exclusión</text>
  <text class="cd mono" x="256" y="170">compare-consensus</text>
  <path class="flow" d="M444 128 H 462"/>
  <rect class="bx bx-hi" x="466" y="74" width="200" height="108" rx="9"/>
  <text class="hd l-en" x="478" y="96">Compiled network</text>
  <text class="hd l-es" x="478" y="96">Red compilada</text>
  <text class="sub l-en" x="478" y="114">40,051 cells</text>
  <text class="sub l-es" x="478" y="114">40.051 células</text>
  <text class="sub l-en" x="478" y="129">2,922,900 connections</text>
  <text class="sub l-es" x="478" y="129">2.922.900 conexiones</text>
  <text class="cd mono" x="478" y="170">characterize-connectome</text>
  <path class="flow" d="M666 128 H 684"/>
  <rect class="bx bx-good" x="688" y="74" width="190" height="108" rx="9"/>
  <text class="hd l-en" x="700" y="96">Checks</text>
  <text class="hd l-es" x="700" y="96">Verificaciones</text>
  <text class="sub l-en" x="700" y="114">parity with the published model</text>
  <text class="sub l-es" x="700" y="114">paridad con el modelo publicado</text>
  <text class="sub l-en" x="700" y="129">tuning, stability, controls</text>
  <text class="sub l-es" x="700" y="129">ajuste, estabilidad, controles</text>
  <text class="cd mono" x="700" y="170">parity-published</text>
  <rect class="bx bx-warn" x="22" y="214" width="300" height="88" rx="9"/>
  <text class="hd l-en" x="34" y="236">Outside git</text>
  <text class="hd l-es" x="34" y="236">Fuera de git</text>
  <text class="sub l-en" x="34" y="254">the raw release, engine checkpoints,</text>
  <text class="sub l-es" x="34" y="254">la liberación cruda, puntos de control</text>
  <text class="sub l-en" x="34" y="269">run logs: heavy and reproducible</text>
  <text class="sub l-es" x="34" y="269">del motor, bitácoras: pesados, reproducibles</text>
  <rect class="bx" x="346" y="214" width="330" height="88" rx="9"/>
  <text class="hd l-en" x="358" y="236">Committed</text>
  <text class="hd l-es" x="358" y="236">Versionado</text>
  <text class="sub l-en" x="358" y="254">specification, reports, explorer artifact</text>
  <text class="sub l-es" x="358" y="254">especificación, reportes, artefacto explorador</text>
  <text class="sub l-en" x="358" y="269">and its manifest (size, SHA-256, terms)</text>
  <text class="sub l-es" x="358" y="269">y su manifiesto (tamaño, SHA-256, términos)</text>
  <text class="cd mono" x="358" y="290">export-web</text>
  <path class="flow" d="M577 182 V 210"/>
  <path class="flow" d="M144 182 V 210"/>
  <rect class="lane" x="10" y="318" width="880" height="140" rx="10"/>
  <text class="lane-lbl l-en" x="22" y="336">BROWSER  (static site on GitHub Pages)</text>
  <text class="lane-lbl l-es" x="22" y="336">NAVEGADOR  (sitio estático en GitHub Pages)</text>
  <path class="flow" d="M511 302 V 346"/>
  <rect class="bx" x="420" y="348" width="180" height="98" rx="9"/>
  <text class="hd l-en" x="432" y="370">Fetch</text>
  <text class="hd l-es" x="432" y="370">Descarga</text>
  <text class="sub l-en" x="432" y="388">manifest, then artifact</text>
  <text class="sub l-es" x="432" y="388">manifiesto, luego artefacto</text>
  <text class="sub l-en" x="432" y="403">absolute paths</text>
  <text class="sub l-es" x="432" y="403">rutas absolutas</text>
  <path class="flow" d="M600 397 H 618"/>
  <rect class="bx bx-hi" x="622" y="348" width="256" height="98" rx="9"/>
  <text class="hd l-en" x="634" y="370">Verify, then show</text>
  <text class="hd l-es" x="634" y="370">Verificar, luego mostrar</text>
  <text class="sub l-en" x="634" y="388">contract checked, SHA-256 compared</text>
  <text class="sub l-es" x="634" y="388">contrato revisado, SHA-256 comparado</text>
  <text class="sub l-en" x="634" y="403">explorer, Experiments, Benchmark</text>
  <text class="sub l-es" x="634" y="403">explorador, Experimentos, Benchmark</text>
  <rect class="bx bx-plan" x="22" y="348" width="370" height="98" rx="9"/>
  <text class="hd l-en" x="34" y="370">Live methods</text>
  <text class="hd l-es" x="34" y="370">Métodos en vivo</text>
  <text class="sub l-en" x="34" y="388">methods that pass a parity and latency gate</text>
  <text class="sub l-es" x="34" y="388">métodos que superen una compuerta de</text>
  <text class="sub l-en" x="34" y="403">run client-side; the rest replay results</text>
  <text class="sub l-es" x="34" y="403">paridad y latencia corren en el cliente</text>
  <text class="cd mono" x="34" y="434">ONNX / WebGPU</text>
</svg>
