<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" class="arch-svg" role="img" aria-label="Conectoma: the web build and what a page does at runtime">
  <style>
    .arch-svg text { font-family: var(--font-sans, Inter, "Segoe UI", system-ui, sans-serif); }
    .arch-svg .mono { font-family: var(--font-mono, ui-monospace, Consolas, monospace); }
    .arch-svg .bx { fill: var(--color-surface-2); stroke: var(--color-border); stroke-width: 1.2; }
    .arch-svg .bx-hi { stroke: var(--color-accent); stroke-width: 1.6; }
    .arch-svg .bx-good { stroke: var(--color-good); }
    .arch-svg .bx-warn { stroke: var(--color-warn); }
    .arch-svg .bx-plan { stroke-dasharray: 5 4; }
    .arch-svg .lane { fill: none; stroke: var(--color-border); stroke-width: 1; stroke-dasharray: 2 3; }
    .arch-svg .ttl { fill: var(--color-fg); font-size: 13px; font-weight: 600; }
    .arch-svg .hd { fill: var(--color-fg); font-size: 11.5px; font-weight: 600; }
    .arch-svg .sub { fill: var(--color-fg-subtle); font-size: 10px; }
    .arch-svg .cd { fill: var(--color-accent); font-size: 9.5px; }
    .arch-svg .lbl { fill: var(--color-accent); font-size: 10px; font-weight: 600; }
    .arch-svg .lane-lbl { fill: var(--color-fg-faint); font-size: 10px; font-weight: 600; letter-spacing: 0.04em; }
    .arch-svg .good { fill: var(--color-good); }
    .arch-svg .warn { fill: var(--color-warn); }
    .arch-svg .flow { fill: none; stroke: var(--color-fg-faint); stroke-width: 1.5; marker-end: url(#arr); }
    .arch-svg .flow-hi { fill: none; stroke: var(--color-accent); stroke-width: 1.5; marker-end: url(#arr-hi); }
    .arch-svg .wire { fill: none; stroke: var(--color-fg-faint); stroke-width: 1.2; }
    .arch-svg .cell { fill: var(--color-surface); stroke: var(--color-fg-subtle); stroke-width: 1.2; }
    .arch-svg .cell-hi { fill: var(--color-accent-soft); stroke: var(--color-accent); stroke-width: 1.4; }
    .arch-svg .hex { fill: none; stroke: var(--color-border); stroke-width: 1; }
    .arch-svg .hex-src { fill: var(--color-accent-soft); stroke: var(--color-accent); stroke-width: 1.2; }
    .arch-svg .hex-tar { fill: var(--color-surface); stroke: var(--color-fg); stroke-width: 1.4; }
    svg .l-es { display: none; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--color-fg-faint)"/>
    </marker>
    <marker id="arr-hi" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent)"/>
    </marker>
  </defs>
  <text class="ttl l-en" x="20" y="28">The web: built from committed data, checked before it is shown</text>
  <text class="ttl l-es" x="20" y="28">La web: construida desde datos versionados, revisada antes de mostrarse</text>
  <rect class="lane" x="10" y="44" width="880" height="140" rx="10"/>
  <text class="lane-lbl l-en" x="22" y="62">BUILD</text>
  <text class="lane-lbl l-es" x="22" y="62">BUILD</text>
  <rect class="bx" x="22" y="74" width="160" height="98" rx="9"/>
  <text class="hd l-en" x="34" y="96">Copy data</text>
  <text class="hd l-es" x="34" y="96">Copiar datos</text>
  <text class="sub l-en" x="34" y="114">committed reports</text>
  <text class="sub l-es" x="34" y="114">reportes versionados</text>
  <text class="sub l-en" x="34" y="129">and artifacts</text>
  <text class="sub l-es" x="34" y="129">y artefactos</text>
  <text class="cd mono" x="34" y="160">copy-data.mjs</text>
  <path class="flow" d="M182 123 H 194"/>
  <rect class="bx bx-hi" x="197" y="74" width="160" height="98" rx="9"/>
  <text class="hd l-en" x="209" y="96">Typecheck, test</text>
  <text class="hd l-es" x="209" y="96">Tipos, pruebas</text>
  <text class="sub l-en" x="209" y="114">contract checked</text>
  <text class="sub l-es" x="209" y="114">contrato revisado</text>
  <text class="sub l-en" x="209" y="129">on the real files</text>
  <text class="sub l-es" x="209" y="129">en los archivos reales</text>
  <text class="cd mono" x="209" y="160">tsc, vitest</text>
  <path class="flow" d="M357 123 H 369"/>
  <rect class="bx" x="372" y="74" width="160" height="98" rx="9"/>
  <text class="hd l-en" x="384" y="96">Bundle</text>
  <text class="hd l-es" x="384" y="96">Empaquetar</text>
  <text class="sub l-en" x="384" y="114">absolute base /</text>
  <text class="sub l-es" x="384" y="114">base absoluta /</text>
  <text class="sub l-en" x="384" y="129">KaTeX, shell</text>
  <text class="sub l-es" x="384" y="129">KaTeX, shell</text>
  <text class="cd mono" x="384" y="160">vite build</text>
  <path class="flow" d="M532 123 H 544"/>
  <rect class="bx" x="547" y="74" width="160" height="98" rx="9"/>
  <text class="hd l-en" x="559" y="96">A document per route</text>
  <text class="hd l-es" x="559" y="96">Un documento por ruta</text>
  <text class="sub l-en" x="559" y="114">deep links answer</text>
  <text class="sub l-es" x="559" y="114">los enlaces profundos</text>
  <text class="sub l-en" x="559" y="129">with the app</text>
  <text class="sub l-es" x="559" y="129">responden con la app</text>
  <text class="cd mono" x="559" y="160">static-routes.mjs</text>
  <path class="flow" d="M707 123 H 719"/>
  <rect class="bx" x="722" y="74" width="160" height="98" rx="9"/>
  <text class="hd l-en" x="734" y="96">Publish</text>
  <text class="hd l-es" x="734" y="96">Publicar</text>
  <text class="sub l-en" x="734" y="114">GitHub Pages</text>
  <text class="sub l-es" x="734" y="114">GitHub Pages</text>
  <text class="sub l-en" x="734" y="129">custom domain</text>
  <text class="sub l-es" x="734" y="129">dominio propio</text>
  <text class="cd mono" x="734" y="160">conectoma.fasl-work.com</text>
  <rect class="lane" x="10" y="200" width="880" height="236" rx="10"/>
  <text class="lane-lbl l-en" x="22" y="218">RUNTIME</text>
  <text class="lane-lbl l-es" x="22" y="218">EJECUCIÓN</text>
  <rect class="bx" x="22" y="230" width="170" height="100" rx="9"/>
  <text class="hd l-en" x="34" y="252">Six routes</text>
  <text class="hd l-es" x="34" y="252">Seis rutas</text>
  <text class="sub l-en" x="34" y="270">App, Introduction,</text>
  <text class="sub l-es" x="34" y="270">App, Introducción,</text>
  <text class="sub l-en" x="34" y="285">Methodology, Implementation,</text>
  <text class="sub l-es" x="34" y="285">Metodología, Implementación,</text>
  <text class="sub l-en" x="34" y="300">Experiments, Benchmark</text>
  <text class="sub l-es" x="34" y="300">Experimentos, Benchmark</text>
  <path class="flow" d="M192 262 H 222"/>
  <rect class="bx bx-hi" x="226" y="230" width="200" height="100" rx="9"/>
  <text class="hd l-en" x="238" y="252">App: the explorer</text>
  <text class="hd l-es" x="238" y="252">App: el explorador</text>
  <text class="sub l-en" x="238" y="270">manifest and artifact checked</text>
  <text class="sub l-es" x="238" y="270">manifiesto y artefacto revisados</text>
  <text class="sub l-en" x="238" y="285">digest compared, model built</text>
  <text class="sub l-es" x="238" y="285">digest comparado, modelo armado</text>
  <text class="cd mono" x="238" y="318">loadExplorer</text>
  <path class="flow" d="M426 262 H 456"/>
  <rect class="bx" x="460" y="230" width="200" height="100" rx="9"/>
  <text class="hd l-en" x="472" y="252">Filters and placement</text>
  <text class="hd l-es" x="472" y="252">Filtros y ubicación</text>
  <text class="sub l-en" x="472" y="270">what a type receives or sends</text>
  <text class="sub l-es" x="472" y="270">lo que un tipo recibe o envía</text>
  <text class="sub l-en" x="472" y="285">vs the published consensus</text>
  <text class="sub l-es" x="472" y="285">vs el consenso publicado</text>
  <path class="flow" d="M660 262 H 690"/>
  <rect class="bx" x="694" y="230" width="184" height="100" rx="9"/>
  <text class="hd l-en" x="706" y="252">State in the URL</text>
  <text class="hd l-es" x="706" y="252">Estado en la URL</text>
  <text class="sub l-en" x="706" y="270">type, view, minimum,</text>
  <text class="sub l-es" x="706" y="270">tipo, vista, mínimo,</text>
  <text class="sub l-en" x="706" y="285">comparison, partner</text>
  <text class="sub l-es" x="706" y="285">comparación, socio</text>
  <text class="cd mono" x="706" y="318">?type=T4a&amp;view=...</text>
  <path class="flow" d="M107 330 V 364"/>
  <rect class="bx" x="22" y="366" width="404" height="60" rx="9"/>
  <text class="hd l-en" x="34" y="388">Pages: every number from a committed report</text>
  <text class="hd l-es" x="34" y="388">Páginas: cada número desde un reporte versionado</text>
  <text class="sub l-en" x="34" y="406">six reports read at load, none typed into the page</text>
  <text class="sub l-es" x="34" y="406">seis reportes leídos al cargar, ninguno escrito en la página</text>
  <rect class="bx bx-good" x="460" y="366" width="418" height="60" rx="9"/>
  <text class="hd l-en" x="472" y="388">Fit gate on the built site</text>
  <text class="hd l-es" x="472" y="388">Compuerta de ajuste sobre el sitio construido</text>
  <text class="sub l-en" x="472" y="406">1280x800, 1600x900, 2560x1440: no page scroll, one tab row</text>
  <text class="sub l-es" x="472" y="406">1280x800, 1600x900, 2560x1440: sin scroll, una fila de pestañas</text>
</svg>
